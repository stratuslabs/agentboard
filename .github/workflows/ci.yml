name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A real Postgres for the tests that need one (card numbering under
    # concurrent creates). Same major version as docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          AGENTBOARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: npm run build

      - name: Smoke test the packed CLI
        run: node scripts/smoke-cli-pack.mjs

  # The core consumed as a package by another Next app (test/consumer), the
  # way the hosted edition uses it: packed, installed, built and driven over
  # HTTP. Run against the lowest Next the peer range allows and the newest 16.x.
  consumer:
    name: consumer (next ${{ matrix.next }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next: ["16.4.3", "16"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Build and drive the consumer fixture
        run: node scripts/verify-consumer.mjs --next "${{ matrix.next }}"
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react-dom requires the exact same react version, so they must land
      # in one PR. Listed before dev-dependencies so the @types packages
      # travel with their runtime packages.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint (via eslint-config-next) supports TypeScript <6.1,
      # so a TS 7 bump fails lint. Take majors by hand once it is supported.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint majors change config and rules; upgrade deliberately.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
